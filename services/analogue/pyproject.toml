[project]
name = "medstock-analogue"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medstock-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # AI migration Phase 1-2 (docs/ai_workflows_migration_plan.md) -- analogue
    # only, per plan §7 Phase 0. langtrace-python-sdk is Phase 3, not added yet.
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.uv.sources]
medstock-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
