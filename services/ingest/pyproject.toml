[project]
name = "medstock-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "medstock-shared",
    "httpx>=0.27", "tenacity>=9.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.uv.sources]
medstock-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
