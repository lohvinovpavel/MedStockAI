---
# COMP-1: FDA approval, listing dates and open recalls -> drug_certification.
# Pages the NDC Directory in bulk (1 000 records/request, MAX_PAGES cap) rather
# than querying per drug — see the budget note at the top of this file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-certification
spec:
  schedule: "0 5 * * *"   # daily, offset from pricing at 03:00
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: certification
            image: ghcr.io/medstockai/ingest:latest
            command: ["python", "-m", "app.certification"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 512Mi }
