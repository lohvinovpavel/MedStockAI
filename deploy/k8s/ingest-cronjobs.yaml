---
# PP-3: FDA label prose -> drug_risk_profile, for the drugs actually stocked.
#
# Driven by `--formulary`, so it follows operations rather than a hand-kept
# list: add a drug to the formulary and it is covered on the next run. Weekly,
# because labels change on the order of months and every run costs model calls.
#
# Writes `awaiting_approval` only. Nothing here can colour a screen until a
# pharmacist accepts it (docs/prognosis-and-procurement.md §1.3).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-prognosis
spec:
  schedule: "0 6 * * 0"   # weekly, Sunday, after the reference feeds
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: prognosis
            image: ghcr.io/medstockai/ingest:latest
            command: ["python", "-m", "app.prognosis", "--formulary", "--limit", "50"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            # The only ingest job that needs a model key. Extraction is offline,
            # so no request ever waits on it and no patient data is involved.
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: medstock-ai, key: gemini-api-key }
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { memory: 512Mi }
---
# COMP-1: FDA approval, listing dates and open recalls -> drug_certification.
# Pages the NDC Directory in bulk (1 000 records/request, MAX_PAGES cap) rather
# than querying per drug — see the budget note at the top of this file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-certification
spec:
  schedule: "0 5 * * *"   # daily, offset from pricing at 03:00
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: certification
            image: ghcr.io/medstockai/ingest:latest
            command: ["python", "-m", "app.certification"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 512Mi }
---
# Import certification: FDA Import Alert Red Lists -> import_alert.
# Weekly, because the FDA republishes these lists on a similar cadence and the
# pages are ~2 MB each. HTML scraping, deliberately (compliance-usecases.md
# `OPEN` item 3) — no JSON API exposes import alerts, and without them import
# certification cannot be covered at all. The parser reports zero firms rather
# than wrong ones if the layout moves, so a silent empty run is the signal to
# check it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-import-alerts
spec:
  schedule: "0 4 * * 1"   # Mondays 04:00, before the 05:00 certification pass
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: import-alerts
            image: ghcr.io/medstockai/ingest:latest
            command: ["python", "-m", "app.import_alerts"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              # ~2 MB of HTML held as a string plus the regex scan over it.
              limits: { memory: 512Mi }
---
# Informal signal: press mentions for stocked drugs -> news_signal.
# Daily, because news is the fast source — it is the one that moves before the
# datasets do. Whatever it finds can only ever raise yellow
# (compliance-usecases.md §4.3): an article is an unverified claim about a third
# party, and only a government source sets red.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-news
spec:
  schedule: "30 6 * * *"  # daily, after certification so the shelf is current
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: news
            image: ghcr.io/medstockai/ingest:latest
            command: ["python", "-m", "app.news", "--shelf"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 256Mi }
---
# Open enforcement: FDA warning letters -> warning_letter.
# Weekly, alongside import alerts. The source is an XLSX export behind the
# warning-letters listing, not a scrape — sturdier, and it needs no Excel
# dependency because the sheet is flat.
#
# The export does not publish closeout status, so the finding this feeds says a
# letter was issued and never that an investigation is open. See
# compliance-usecases.md §4.1.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-warning-letters
spec:
  schedule: "30 4 * * 1"   # Mondays, after import alerts at 04:00
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: warning-letters
            image: ghcr.io/medstockai/ingest:latest
            command: ["python", "-m", "app.warning_letters"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 256Mi }
---
# Tier 3: CPIC gene-drug guidelines -> pgx_guideline.
# Weekly. CPIC publishes on a slow cadence and the API is keyless, so this is
# cheap; it runs before the prognosis job so both reference feeds are current
# before anything reads them. Unlike faers below it does not depend on the
# formulary, so it works on a brand-new environment before anything is stocked.
#
# Without this job pgx_guideline stays empty and stage 8 silently never runs —
# the tier would be built, tested and permanently invisible.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-cpic
spec:
  schedule: "0 5 * * 0"   # Sundays 05:00, an hour before prognosis
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: cpic
            image: ghcr.io/medstockai/ingest:latest
            # Deliberately NOT --formulary. The whole CPIC set is ~250 rows
            # across ~40 drugs, so filtering saves nothing and silently empties
            # the tier whenever the formulary has not been seeded yet or simply
            # does not overlap CPIC's coverage.
            command: ["python", "-m", "app.cpic"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 256Mi }
---
# Tier 1: FAERS disproportionality -> adr_signal.
# Weekly, and deliberately bounded. openFDA allows 1 000 requests/day per IP
# shared across every feed (services.md §7) and this costs one call per drug
# plus two fixed, so --limit keeps a formulary sweep from eating the budget the
# daily certification pass depends on.
#
# Unlike cpic this one *does* depend on the formulary — it costs a call per
# drug, so it needs a drug list rather than "everything". Run seed-stock (or a
# real formulary load) before it, or it has nothing to ask about.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingest-faers
spec:
  schedule: "0 7 * * 0"   # Sundays 07:00, after prognosis, well clear of the daily passes
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: faers
            image: ghcr.io/medstockai/ingest:latest
            command: ["python", "-m", "app.faers", "--formulary", "--limit", "40"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: medstock-db, key: url }
            resources:
              requests: { cpu: 50m, memory: 64Mi }
              limits: { memory: 256Mi }
