# Demo patients for the prescribe cart — the one place this system stores a
# name and a date of birth (docs/phi-readiness.md, the documented PHI
# exception).
#
# **The data is invented and must stay invented.** Nothing real belongs in this
# table; the rules engine is fed a de-identified vector derived from the row at
# /cart-check time, and that boundary is the whole PHI argument.
#
# Deliberately NOT in kustomization.yaml, same as seed-job and seed-stock-job:
# seeding is something you decide to do, not something a rollout does to you.
#
#   kubectl -n medstock apply -f deploy/k8s/seed-patients-job.yaml
#   kubectl -n medstock wait --for=condition=complete job/seed-patients --timeout=300s
#
# Pass --hospital-id to match the tenant you are demoing; the default is the
# next-dev hospital. Re-running is safe: it skips patients that already exist
# and backfills a genotype onto any seeded before pgx_phenotypes existed.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-patients
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: seed-patients
        # Any image: all carry shared/ + scripts/ (see the root Dockerfile).
        image: ghcr.io/medstockai/patient-profiling:latest
        command: ["python", "scripts/seed_patients.py"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: medstock-db, key: url }
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
