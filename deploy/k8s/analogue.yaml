apiVersion: apps/v1
kind: Deployment
metadata:
  name: analogue
  labels: { app: analogue, part-of: medstock }
spec:
  replicas: 2
  selector:
    matchLabels: { app: analogue }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: analogue, part-of: medstock }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: analogue
        image: ghcr.io/medstockai/analogue:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: { name: medstock-db, key: url }
        - name: JWT_PUBLIC_KEY
          valueFrom:
            configMapKeyRef: { name: medstock-jwt, key: public-key }
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef: { name: medstock-ai, key: gemini-api-key }
        # docs/ai_workflows_migration_plan.md Phase 2 -- routes /copilot/chat
        # through the LangGraph port. Plain value, not a secret/configmap: a
        # rollback is `kubectl set env deploy/analogue COPILOT_GRAPH_ENABLED=false`,
        # no redeploy needed either way.
        - name: COPILOT_GRAPH_ENABLED
          value: "false"
        - name: GEMINI_MODEL
          value: "gemini-3.6-flash"
        - name: LLM_TIMEOUT_SECONDS
          value: "60.0"
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits:   { memory: 512Mi }
        livenessProbe:
          httpGet: { path: /healthz, port: 8000 }
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /readyz, port: 8000 }
          periodSeconds: 5
        lifecycle:
          preStop:
            exec: { command: ["sleep", "5"] }   # let Ingress deregister first
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: analogue
spec:
  selector: { app: analogue }
  ports:
  - port: 8000
    targetPort: 8000
