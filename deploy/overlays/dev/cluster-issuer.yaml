# Not a Terraform resource — kubernetes_manifest needs the CRD to exist at
# *plan* time, and a fresh apply against an empty project would fail before
# it ever installed cert-manager. See docs/infra-dev-plan.md §2.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE-ME@example.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
    - http01:
        ingress:
          class: nginx
