name: cd

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [auth, inventory, analogue, compliance, patient-profiling, prediction, warehouse, ingest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-web:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ github.sha }}

  deploy:
    needs: [build, build-web]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Authenticate to cluster
        run: |
          echo "${{ secrets.KUBECONFIG }}" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # Schema first, always. A rolled-out pod expecting a column that does not
      # exist yet is the failure this ordering prevents.
      - name: Migrate
        run: |
          kubectl -n medstock delete job migrate --ignore-not-found
          sed "s|:latest|:${{ github.sha }}|" deploy/k8s/migrate-job.yaml | kubectl -n medstock apply -f -
          kubectl -n medstock wait --for=condition=complete job/migrate --timeout=300s

      - name: Roll out
        run: |
          cd deploy/k8s
          for s in auth inventory analogue compliance patient-profiling prediction warehouse web ingest; do
            kustomize edit set image "ghcr.io/medstockai/$s=${{ env.REGISTRY }}/$s:${{ github.sha }}"
          done
          kubectl apply -k .
          # ingest has no Deployment (three CronJobs instead) — nothing to wait on there.
          for s in auth inventory analogue compliance patient-profiling prediction warehouse web; do
            kubectl -n medstock rollout status "deploy/$s" --timeout=180s
          done
