name: deploy-dev

# $54/mo shared sandbox with a hand-rolled JWT key and no RLS
# (docs/infra-dev-plan.md §6). Every merge to main still builds and pushes
# images (below) — the actual rollout (the `deploy` job, and `seed` behind
# it) only runs on a manual workflow_dispatch against main, by design: the
# sandbox is shared, so rolling it out is a deliberate action someone takes,
# not a side effect of merging. Dispatching runs the full pipeline again
# (build included) against whatever main is at that moment, then deploys it.
#
# Two triggers, both always armed — NOT mutually exclusive by path filter,
# that was tried and double-ran: paths-ignore only skips a push where EVERY
# changed file matches, so a merge touching both infra/terraform/** and app
# code fired this workflow directly AND (once infra-cd finished) again via
# workflow_run. The `gate` job below is what actually keeps it to one run:
#  - push: proceeds only if THIS push did not touch infra/terraform/** —
#    checked with a real git diff, not a trigger-level path filter, because
#    "not everything changed" and "this one path didn't change" aren't the
#    same condition. If it did, infra-cd is about to (or already did) fire
#    on the same push, and its workflow_run completion is what proceeds
#    below instead.
#  - workflow_run: proceeds only if that infra-cd run succeeded — a broken
#    infra apply must not be followed by an app deploy on top of it.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [infra-cd]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      seed_dev_users:
        description: "Also (re)create the 4 demo users in St Mary's General — safe to re-run, skips existing ones"
        type: boolean
        default: false
      seed_demo:
        description: "Also seed the full demo dataset (facilities, suppliers, 3yr consumption, forecast, wave5 orders) — safe to re-run (upsert / scoped delete-reload). Runs before seed_stock."
        type: boolean
        default: false
      seed_patients:
        description: "Also seed demo patients (8 curated + generated) — safe to re-run, skips existing ones"
        type: boolean
        default: false
      patient_count:
        description: "Generated demo patients to seed on top of the 8 curated ones (blank = the manifest default, 1000). Only used when seed_patients is checked."
        type: string
        default: ""
      seed_stock:
        description: "Also seed demo stock onto the dashboard shelf, then certify it immediately — safe to re-run (upsert). Runs after seed_demo."
        type: boolean
        default: false
      seed_feeds:
        description: "Also run the weekly reference-data feeds (cpic, faers, import-alerts, warning-letters, news, prognosis) once now instead of waiting for their cron slot — safe to re-run. Runs after seed_stock."
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  # Matches deploy/overlays/dev/kustomization.yaml — infra/terraform/dev/registry.tf.
  REGISTRY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/medstock
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: medstock-dev
  # On workflow_run, plain github.sha is the branch tip at event time, not
  # necessarily the commit that triggered infra-cd — use everywhere below
  # instead of github.sha directly (push events fall through unchanged).
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  GKE_ZONE: europe-west1-b

jobs:
  # Decides whether this run should actually build/deploy anything — see
  # the trigger comment above for why this can't be a trigger-level path
  # filter. Tests are NOT re-run here: ci.yml already gated the PR that
  # produced this commit, and re-running the full suite on every merge to
  # main just to build the exact commit that already passed it is redundant
  # — build fails loudly anyway if something's actually broken.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0
      - id: decide
        run: |
          case "${{ github.event_name }}" in
            workflow_run)
              if [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
                echo "proceed=true" >> "$GITHUB_OUTPUT"
              else
                echo "proceed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            push)
              # No history to diff against (fresh branch, force-push) reads
              # as "assume infra changed" — the safer of the two wrong
              # guesses, since it just defers to workflow_run instead of
              # possibly racing an infra-cd run that's also about to start.
              if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- infra/terraform/ 2>/dev/null; then
                echo "proceed=true" >> "$GITHUB_OUTPUT"
              else
                echo "proceed=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    strategy:
      matrix:
        service: [auth, inventory, analogue, compliance, patient-profiling, prediction, warehouse, ingest]
    steps:
      # workflow_run runs default to the branch tip, not the exact SHA
      # that triggered infra-cd — DEPLOY_SHA pins it (see env: above).
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            GIT_SHA=${{ env.DEPLOY_SHA }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=dev-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.service }}

  build-web:
    needs: [gate]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      # workflow_run runs default to the branch tip, not the exact SHA
      # that triggered infra-cd — DEPLOY_SHA pins it (see env: above).
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v3
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          build-args: GIT_SHA=${{ env.DEPLOY_SHA }}
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ env.DEPLOY_SHA }}

  deploy:
    needs: [build, build-web]
    # Manual only — see the trigger comment at the top of this file. The
    # ref check matters: workflow_dispatch lets you pick any branch to run
    # against, and this sandbox's manifests/migrations should only ever
    # come from main.
    # if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      # workflow_run runs default to the branch tip, not the exact SHA
      # that triggered infra-cd — DEPLOY_SHA pins it (see env: above).
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2

      # Schema first, always — see cd.yml for why.
      - name: Migrate
        run: |
          kubectl -n medstock delete job migrate --ignore-not-found
          sed "s|ghcr.io/medstockai/inventory:latest|${{ env.REGISTRY }}/inventory:${{ env.DEPLOY_SHA }}|" deploy/k8s/migrate-job.yaml | kubectl -n medstock apply -f -
          kubectl -n medstock wait --for=condition=complete job/migrate --timeout=300s

      # The static IP survives a normal apply but not a full destroy/recreate
      # of the sandbox, so the hostname can't stay committed in git — read
      # whatever the LoadBalancer Service actually has right now instead.
      - name: Resolve ingress host
        run: |
          ip="$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          echo "INGRESS_HOST=medstock-dev.${ip//./-}.sslip.io" >> "$GITHUB_ENV"

      - name: Roll out
        run: |
          cd deploy/overlays/dev
          sed -i "s/medstock-dev\.REPLACE-ME\.sslip\.io/${{ env.INGRESS_HOST }}/g" kustomization.yaml
          for s in auth inventory analogue compliance patient-profiling prediction warehouse web ingest; do
            kustomize edit set image "ghcr.io/medstockai/$s=${{ env.REGISTRY }}/$s:${{ env.DEPLOY_SHA }}"
          done
          kubectl apply -k .
          for s in auth inventory analogue compliance patient-profiling prediction warehouse web; do
            kubectl -n medstock rollout status "deploy/$s" --timeout=180s
          done

  # Opt-in, same as `seed` below — a rollout should not quietly write rows.
  # It's still lower-stakes than the user seed (idempotent count in the log,
  # not a generated password; `patient` is the documented PHI exception in
  # docs/phi-readiness.md and cannot hold a real patient — the rows are
  # invented, fixed pools and a seeded RNG), but that's a reason it's *safe*
  # to check the box, not a reason to skip asking.
  #
  # Ordered after seed-stock (docs/populating-a-new-environment.md §5's
  # canonical order) via `needs`, but `!failure() && !cancelled()` means an
  # *unchecked* (skipped, not failed) seed-stock doesn't block this from
  # running on its own — only a seed-stock that actually failed does.
  seed-patients:
    needs: [deploy, seed, seed-stock]
    if: ${{ !failure() && !cancelled() && inputs.seed_patients }}
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4

      - name: Seed demo patients
        env:
          PATIENT_COUNT: ${{ inputs.patient_count }}
        run: |
          img="${{ env.REGISTRY }}/patient-profiling:${{ env.DEPLOY_SHA }}"
          src=deploy/k8s/seed-patients-job.yaml
          sed "s|ghcr.io/medstockai/patient-profiling:latest|$img|" "$src" > /tmp/seed-patients.yaml
          if [ -n "$PATIENT_COUNT" ]; then
            sed -i "s|value: \"1000\"|value: \"$PATIENT_COUNT\"|" /tmp/seed-patients.yaml
          fi
          # A Job's pod template is immutable, so a re-run replaces the object
          # rather than patching it.
          kubectl -n medstock delete job seed-patients --ignore-not-found
          kubectl -n medstock apply -f /tmp/seed-patients.yaml
          kubectl -n medstock wait --for=condition=complete job/seed-patients --timeout=300s
          kubectl -n medstock logs job/seed-patients
          kubectl -n medstock delete job seed-patients
  seed:
    needs: [deploy]
    if: ${{ inputs.seed_dev_users }}
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      # workflow_run runs default to the branch tip, not the exact SHA
      # that triggered infra-cd — DEPLOY_SHA pins it (see env: above).
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4

      # app/seed.py is idempotent and prints the password only for users it
      # actually creates — this job's log is the only place to read it.
      - name: Seed demo users
        run: |
          kubectl -n medstock delete job seed --ignore-not-found
          sed "s|REPLACE-ME-IMAGE|${{ env.REGISTRY }}/auth:${{ env.DEPLOY_SHA }}|" deploy/k8s/seed-job.yaml | kubectl -n medstock apply -f -
          kubectl -n medstock wait --for=condition=complete job/seed --timeout=60s
          kubectl -n medstock logs job/seed
          kubectl -n medstock delete job seed

  # Opt-in, same reasoning as `seed`. Facilities, suppliers, 3yr consumption
  # history, the seeded forecast run, and the wave5 demo orders/review
  # decisions -- deploy/k8s/seed-demo-job.yaml. Ordered after `seed` (the
  # hospital it resolves-or-creates should already carry the 4 demo users),
  # before `seed-stock` (docs/populating-a-new-environment.md #5's canonical
  # order). `!failure() && !cancelled()`, not the default `success()`: an
  # unchecked (skipped) `seed` must not block this from running standalone.
  seed-demo:
    needs: [deploy, seed]
    if: ${{ !failure() && !cancelled() && inputs.seed_demo }}
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4

      - name: Seed demo dataset
        run: |
          kubectl -n medstock delete job seed-demo --ignore-not-found
          sed "s|ghcr.io/medstockai/ingest:latest|${{ env.REGISTRY }}/ingest:${{ env.DEPLOY_SHA }}|" deploy/k8s/seed-demo-job.yaml | kubectl -n medstock apply -f -
          kubectl -n medstock wait --for=condition=complete job/seed-demo --timeout=600s
          kubectl -n medstock logs job/seed-demo
          kubectl -n medstock delete job seed-demo

  # Opt-in, same reasoning as `seed` -- a rollout should not quietly write
  # rows. Until this has run once in an environment, ingest-certification
  # certifies shelf_ndcs() against an empty stock_snapshot and every badge on
  # the dashboard reads "unknown" with nothing reporting an error (see
  # deploy/k8s/seed-stock-job.yaml). The `certify` job below is what stops the
  # freshly seeded shelf sitting grey until the next 05:00 schedule; it is
  # ordered after this one for exactly that reason.
  #
  # Ordered after seed-demo; `!failure() && !cancelled()` lets this run on
  # its own when seed_demo wasn't checked this dispatch (skipped, not
  # failed) -- same pattern as seed-demo and seed-patients.
  seed-stock:
    needs: [deploy, seed-demo]
    if: ${{ !failure() && !cancelled() && inputs.seed_stock }}
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4

      - name: Seed demo stock
        run: |
          kubectl -n medstock delete job seed-stock --ignore-not-found
          sed "s|ghcr.io/medstockai/inventory:latest|${{ env.REGISTRY }}/inventory:${{ env.DEPLOY_SHA }}|" deploy/k8s/seed-stock-job.yaml | kubectl -n medstock apply -f -
          kubectl -n medstock wait --for=condition=complete job/seed-stock --timeout=300s
          kubectl -n medstock logs job/seed-stock
          kubectl -n medstock delete job seed-stock

  # Certification is NOT opt-in, unlike everything else below — it reads the
  # FDA NDC Directory into drug_certification and does not write demo rows, so
  # the reason the seed jobs ask first does not apply to it.
  #
  # It used to be a step inside seed-stock, which meant it only ran when
  # someone checked `seed_dev_stock`. Every other deploy left the traffic
  # light showing whatever the 05:00 cron last wrote: a drug recalled since
  # then still read green, and a newly stocked drug read "unknown" with
  # nothing reporting an error. On a compliance surface, stale and confidently
  # green is worse than absent — so it now runs on every rollout.
  #
  # Ordered last of the data jobs, and both dependencies matter:
  #  - seed-stock, because certification certifies shelf_ndcs() and an empty
  #    stock_snapshot certifies nothing.
  #  - seed-feeds, because ingest-import-alerts writes the import_alert rows
  #    this pass reads. The cron schedules encode the same order (import
  #    alerts Mondays 04:00, certification 05:00); certifying before the
  #    alerts land would produce a green badge for a firm that is on a Red
  #    List, which is the exact failure this surface exists to prevent.
  # The condition is `needs.deploy.result == 'success'`, NOT the seed jobs'
  # `!failure() && !cancelled()`. That idiom is also true when a dependency
  # was *skipped*, which is what those jobs want — but they are additionally
  # gated on an `inputs.*` checkbox that is only ever set on a dispatch. This
  # job has no such checkbox, so the same expression would fire it on pushes
  # the `gate` job deliberately turned away, certifying against a rollout that
  # never happened. Keyed on deploy succeeding, it runs when there is
  # something to certify and stays quiet otherwise, while still tolerating
  # seed-stock and seed-feeds being skipped.
  certify:
    needs: [deploy, seed-stock, seed-feeds]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4

      # --from=cronjob pins nothing to DEPLOY_SHA: the CronJob's own image is
      # whatever the rollout above just applied, which is the point — this
      # certifies with the code being deployed, not with a tag resolved here.
      - name: Refresh drug certification
        run: |
          kubectl -n medstock delete job certify-now --ignore-not-found
          kubectl -n medstock create job certify-now --from=cronjob/ingest-certification
          if ! kubectl -n medstock wait --for=condition=complete job/certify-now --timeout=600s; then
            echo "::group::certify-now did not complete"
            kubectl -n medstock describe job certify-now || true
            kubectl -n medstock logs job/certify-now --tail=200 || true
            echo "::endgroup::"
            kubectl -n medstock delete job certify-now --ignore-not-found
            echo "::error::Certification did not finish. The traffic light is now serving whatever the last successful pass wrote — treat badge state as stale until this is fixed."
            exit 1
          fi
          kubectl -n medstock logs job/certify-now
          kubectl -n medstock delete job certify-now

  # Opt-in, one-time catch-up for the weekly reference-data feeds
  # (docs/populating-a-new-environment.md #2) -- a freshly seeded environment
  # otherwise shows an empty Prognosis Review, no PGx/ADR findings and no
  # import-alert or warning-letter badges until each feed's own weekly cron
  # slot comes round, which for the Sunday/Monday jobs can be six days away.
  # ingest-certification is deliberately excluded: the `certify` job runs it
  # on every deploy, and is ordered after this one precisely so it certifies
  # against the import-alert rows this job writes. Running it here as well
  # would certify twice, the first time against stale alerts.
  #
  # Ordered after seed-stock (certification, and so faers's formulary-driven
  # openFDA calls, need stock seeded first per that doc); `!failure() &&
  # !cancelled()` lets this run standalone when seed_stock wasn't checked
  # this dispatch.
  seed-feeds:
    needs: [deploy, seed-stock]
    if: ${{ !failure() && !cancelled() && inputs.seed_feeds }}
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4

      # One feed at a time, not backgrounded: a stuck feed should fail this
      # step loudly with its own log attached, not get lost among six.
      - name: Run reference-data feeds once
        run: |
          for feed in cpic faers import-alerts warning-letters news prognosis; do
            echo "::group::ingest-$feed"
            kubectl -n medstock delete job "now-$feed" --ignore-not-found
            kubectl -n medstock create job "now-$feed" --from="cronjob/ingest-$feed"
            kubectl -n medstock wait --for=condition=complete "job/now-$feed" --timeout=900s
            kubectl -n medstock logs "job/now-$feed"
            kubectl -n medstock delete job "now-$feed"
            echo "::endgroup::"
          done
