name: deploy-dev

# $54/mo shared sandbox with a hand-rolled JWT key and no RLS
# (docs/infra-dev-plan.md §6) — every merge to main redeploys it. infra/
# changes deploy separately (infra-cd.yml); path-ignored here so an
# infra-only PR doesn't also rebuild and redeploy all nine images.
on:
  push:
    branches: [main]
    paths-ignore: ["infra/**"]
  workflow_dispatch:
    inputs:
      seed_dev_users:
        description: "Also (re)create the 4 demo users in St Mary's General — safe to re-run, skips existing ones"
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  # Matches deploy/overlays/dev/kustomization.yaml — infra/terraform/dev/registry.tf.
  REGISTRY: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/medstock
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GKE_CLUSTER: medstock-dev
  GKE_ZONE: europe-west1-b

jobs:
  # Same gate as ci.yml's PR checks, re-run here because main can move
  # between a PR's last green check and its merge (another PR landing
  # first, a non-PR push). See ci.yml for why this is per-service instead
  # of one combined `pytest services/`.
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, inventory, analogue, compliance, patient-profiling, prediction, warehouse, ingest]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medstock
          POSTGRES_PASSWORD: medstock
          POSTGRES_DB: medstock
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://medstock:medstock@localhost:5432/medstock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv sync --package medstock-${{ matrix.service }}
      # --no-sync matters: a bare `uv run` re-syncs the whole workspace
      # first (all 8 services' `app` back in one venv, the exact collision
      # the scoped sync above exists to avoid). See ci.yml.
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync pytest services/${{ matrix.service }}/tests -q

  web-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package.json }
      - run: npm install
      - run: npm run lint
      - run: npm run build

  build:
    needs: [python-tests, web-tests]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    strategy:
      matrix:
        service: [auth, inventory, analogue, compliance, patient-profiling, prediction, warehouse, ingest]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            SERVICE=${{ matrix.service }}
            GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=dev-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.service }}

  build-web:
    needs: [python-tests, web-tests]
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: ${{ env.REGISTRY }}/web:${{ github.sha }}

  deploy:
    needs: [build, build-web]
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4
      - uses: imranismail/setup-kustomize@v2

      # Schema first, always — see cd.yml for why.
      - name: Migrate
        run: |
          kubectl -n medstock delete job migrate --ignore-not-found
          sed "s|ghcr.io/medstockai/inventory:latest|${{ env.REGISTRY }}/inventory:${{ github.sha }}|" deploy/k8s/migrate-job.yaml | kubectl -n medstock apply -f -
          kubectl -n medstock wait --for=condition=complete job/migrate --timeout=300s

      # The static IP survives a normal apply but not a full destroy/recreate
      # of the sandbox, so the hostname can't stay committed in git — read
      # whatever the LoadBalancer Service actually has right now instead.
      - name: Resolve ingress host
        run: |
          ip="$(kubectl -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          echo "INGRESS_HOST=medstock-dev.${ip//./-}.sslip.io" >> "$GITHUB_ENV"

      - name: Roll out
        run: |
          cd deploy/overlays/dev
          sed -i "s/medstock-dev\.REPLACE-ME\.sslip\.io/${{ env.INGRESS_HOST }}/g" kustomization.yaml
          for s in auth inventory analogue compliance patient-profiling prediction warehouse web ingest; do
            kustomize edit set image "ghcr.io/medstockai/$s=${{ env.REGISTRY }}/$s:${{ github.sha }}"
          done
          kubectl apply -k .
          for s in auth inventory analogue compliance patient-profiling prediction warehouse web; do
            kubectl -n medstock rollout status "deploy/$s" --timeout=180s
          done

  seed:
    needs: [deploy]
    if: ${{ inputs.seed_dev_users }}
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: azure/setup-kubectl@v4

      # app/seed.py is idempotent and prints the password only for users it
      # actually creates — this job's log is the only place to read it.
      - name: Seed demo users
        run: |
          kubectl -n medstock delete job seed --ignore-not-found
          sed "s|REPLACE-ME-IMAGE|${{ env.REGISTRY }}/auth:${{ github.sha }}|" deploy/k8s/seed-job.yaml | kubectl -n medstock apply -f -
          kubectl -n medstock wait --for=condition=complete job/seed --timeout=60s
          kubectl -n medstock logs job/seed
          kubectl -n medstock delete job seed
