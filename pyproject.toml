[tool.uv.workspace]
members = ["shared", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The copilot's card projection and tool lookups deliberately degrade instead
# of failing the request: a cache miss, projection error, or best-effort name
# lookup falls back to prose/None rather than 500ing a chat turn. Broad
# catches are the design there, not an oversight.
"shared/medstock_shared/ai/cards.py" = ["BLE001", "S110"]
"shared/medstock_shared/ai/tools/pharmacy.py" = ["BLE001", "S110"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in an argument default is FastAPI's idiom, not the mutable-
# default bug B008 exists to catch. Every service hits this on its first real
# route, so it is configured once here.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Body",
    # `require("perm")` builds the dependency callable; it is the same idiom as
    # Depends and is evaluated once at import, not per request.
    "medstock_shared.auth.require",
]

[tool.pytest.ini_options]
# Every service installs as a top-level `app` package (see each service's
# [tool.hatch.build.targets.wheel]) — with all of them synced at once
# (`uv sync --all-packages`, the default), whichever loads first wins
# `sys.modules["app"]` for the rest of the run and every other service's
# `from app.x import y` silently imports its code instead. Run one service
# at a time: `uv sync --package medstock-<name> && uv run --no-sync pytest
# services/<name>/tests` (see .github/workflows/ci.yml).
testpaths = ["services"]
# Eight services each ship `tests/test_health.py`. Under the default prepend
# import mode pytest derives a module name from the basename alone, so the
# second one collides with the first and collection fails for all of them.
# importlib mode keys modules by full path instead, which is what makes a
# workspace of same-shaped services collectable in one run.
addopts = "--import-mode=importlib"
