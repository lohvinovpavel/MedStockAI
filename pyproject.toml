[tool.uv.workspace]
members = ["shared", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in an argument default is FastAPI's idiom, not the mutable-
# default bug B008 exists to catch. Every service hits this on its first real
# route, so it is configured once here.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    # `require("perm")` builds the dependency callable; it is the same idiom as
    # Depends and is evaluated once at import, not per request.
    "medstock_shared.auth.require",
]

[tool.pytest.ini_options]
testpaths = ["services"]
# Eight services each ship `tests/test_health.py`. Under the default prepend
# import mode pytest derives a module name from the basename alone, so the
# second one collides with the first and collection fails for all of them.
# importlib mode keys modules by full path instead, which is what makes a
# workspace of same-shaped services collectable in one run.
addopts = "--import-mode=importlib"
