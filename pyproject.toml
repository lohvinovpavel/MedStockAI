[tool.uv.workspace]
members = ["shared", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in an argument default is FastAPI's idiom, not the mutable-
# default bug B008 exists to catch. Every service hits this on its first real
# route, so it is configured once here.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  # Depends(require("perm")) is the same idiom one level deeper — require()
  # returns the actual dependency callable, it isn't building mutable state.
  "medstock_shared.auth.require",
]

[tool.pytest.ini_options]
# Every service installs as a top-level `app` package (see each service's
# [tool.hatch.build.targets.wheel]) — with all of them synced at once
# (`uv sync --all-packages`, the default), whichever loads first wins
# `sys.modules["app"]` for the rest of the run and every other service's
# `from app.x import y` silently imports its code instead. Run one service
# at a time: `uv sync --package medstock-<name> && uv run --no-sync pytest
# services/<name>/tests` (see .github/workflows/ci.yml).
testpaths = ["services"]
